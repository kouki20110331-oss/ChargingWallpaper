name: Build iOS IPA (Expo)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Expo CLI
        run: npm install -g expo-cli eas-cli

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Bundle React Native JS
        run: |
          mkdir -p ios/main.jsbundle.d
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Get scheme name
        working-directory: ios
        run: |
          SCHEME=$(xcodebuild -workspace ChargingWallpaper.xcworkspace -list -json | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['workspace']['schemes'][0])")
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          echo "Using scheme: $SCHEME"

      - name: Build archive
        working-directory: ios
        run: |
          xcodebuild \
            -workspace ChargingWallpaper.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            SKIP_BUNDLING=1 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export IPA (unsigned)
        working-directory: ios
        run: |
          mkdir -p export
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath export \
            -exportOptionsPlist ExportOptions.plist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/export/*.ipa