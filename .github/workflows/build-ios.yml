name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios

      - name: Show iOS files
        run: |
          echo "===== ios ====="
          ls -la ios
          echo "===== Pods ====="
          ls -la ios/Pods || true

      - name: Build app (No Code Signing)
        run: |
          cd ios
          xcodebuild \
            -workspace ChargingWallpaper.xcworkspace \
            -scheme ChargingWallpaper \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS Project
        uses: actions/upload-artifact@v4
        with:
          name: ios-project
          path: ios
